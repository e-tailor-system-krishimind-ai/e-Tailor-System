<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../../../../">
<meta charset="UTF-8">
<title>My Measurements</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="shared/styles/Clnt_dashboad.css">
</head>
<body>


<!-- TOP NAVBAR -->
<header class="topbar">
  <div class="brand">
    <img src="assets/images/logo2.png" alt="logo">
    <span>e-Tailor</span>
  </div>

  <div class="user">
    <img src="assets/images/user_icon.avif" alt="user">
    <span id="userName">Customer</span>
    <button onclick="logout()">Logout</button>
  </div>
</header>


<div class="layout">
<aside class="sidebar">
<ul>
<li><a href="features/client-dashboard/pages/Clnt_dashboad.html">🏠 Dashboard</a></li>
<li class="active">📐 My Measurements</li>
<li><a href="features/orders/pages/new_order.html">🧵 New Stitch Order</a></li>
<li><a href="features/orders/pages/orders.html">📦 My Orders</a></li>
<li><a href="features/virtual-try-on/pages/vr_try.html">🤖 VR Try-On</a></li>
<li><a href="features/payments/pages/payments.html">💳 Payments</a></li>
<li><a href="features/profile/pages/profile.html">⚙️ Profile</a></li>
</ul>
</aside>

<main class="content">
<h2 class="page-title">My Measurements</h2>

<div class="card p-4 shadow rounded-4">
<form class="row g-3">
  <div class="col-md-4">
    <label class="form-label">Chest (inches)</label>
    <input type="number" class="form-control">
  </div>
  <div class="col-md-4">
    <label class="form-label">Waist (inches)</label>
    <input type="number" class="form-control">
  </div>
  <div class="col-md-4">
    <label class="form-label">Height (cm)</label>
    <input type="number" class="form-control">
  </div>

  <div class="col-12 text-end">
    <button class="btn btn-warning px-4 rounded-pill">Save</button>
  </div>
</form>
</div>

</main>
</div>

<script src="shared/scripts/auth.js"></script>
<script>
const user = getLoggedInUser();
if (user) {
  document.getElementById("userName").innerText = user.name;
}
</script>



<script src="shared/scripts/Clnt_dashboad.js"></script>

</body>
</html>
