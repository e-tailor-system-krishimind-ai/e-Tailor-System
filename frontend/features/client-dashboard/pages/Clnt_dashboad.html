<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../../../../">
  <meta charset="UTF-8">
  <title>Customer Dashboard | e-Tailor</title>

  <link rel="stylesheet" href="shared/styles/Clnt_dashboad.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- ================= TOP NAVBAR ================= -->
<header class="topbar">
  <div class="brand">
    <img src="assets/images/logo2.png" alt="logo">
    <span>e-Tailor</span>
  </div>

  <div class="user">
    <img src="assets/images/user_icon.avif" alt="user">
    <span id="userName">Customer</span>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<!-- ================= MAIN LAYOUT ================= -->
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <ul>
      <li class="active"><a href="features/client-dashboard/pages/Clnt_dashboad.html">🏠 Dashboard</a></li>
      <li><a href="features/measurements/pages/measurements.html">📐 My Measurements</a></li>
      <li><a href="features/orders/pages/new_order.html">🧵 New Stitch Order</a></li>
      <li><a href="features/orders/pages/orders.html">📦 My Orders</a></li>
      <li><a href="features/virtual-try-on/pages/vr_try.html">🤖 VR Try-On</a></li>
      <li><a href="features/payments/pages/payments.html">💳 Payments</a></li>
      <li><a href="features/profile/pages/profile.html">⚙️ Profile</a></li>
    </ul>
  </aside>

  <!-- ================= CONTENT ================= -->
  <main class="content">

    <h2 class="page-title">Dashboard Overview</h2>

    <!-- ===== STATS (DYNAMIC) ===== -->
    <div class="stats">
      <div class="stat-card">
        <span>Total Orders</span>
        <h3 id="totalOrders">0</h3>
      </div>
      <div class="stat-card">
        <span>Active Orders</span>
        <h3 id="activeOrders">0</h3>
      </div>
      <div class="stat-card">
        <span>Completed</span>
        <h3 id="completedOrders">0</h3>
      </div>
      <div class="stat-card">
        <span>Measurements Saved</span>
        <h3 id="measurementsSaved">No</h3>
      </div>
    </div>

    <!-- ===== RECENT ORDERS ===== -->
    <h2 class="section-title">Recent Orders</h2>

    <div class="table-card">
      <table class="table">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Cloth</th>
            <th>Status</th>
            <th>Delivery</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="ordersTable">
          <!-- JS se fill hoga -->
        </tbody>
      </table>
    </div>

  </main>
</div>

<script src="shared/scripts/auth.js"></script>
<script src="shared/scripts/client-dashboard.js"></script>

</body>
</html>
